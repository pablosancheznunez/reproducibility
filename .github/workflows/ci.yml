name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check against the newest R packages.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  r-package:
    # The same checks CRAN runs (--as-cran), on the platforms CRAN builds for.
    name: r-package (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: devel }
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: oldrel-1 }
          - { os: windows-latest, r: release }
          - { os: macos-latest, r: release }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: .
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: .
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  triage:
    # Diagnoses failures on main and opens an issue; never edits code.
    needs: [r-package]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: pablosancheznunez/research-tools-ops/.github/workflows/failure-triage.yml@main
    permissions:
      contents: read
      actions: read
      issues: write
    secrets: inherit
